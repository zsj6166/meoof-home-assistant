name: Bug report
description: Report a reproducible problem with the integration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include phone numbers, SMS codes, API keys, device passwords,
        device UIDs, Home Assistant tokens, snapshots or recordings.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 0.9.1
    validations:
      required: true
  - type: input
    id: home_assistant
    attributes:
      label: Home Assistant version and installation type
      placeholder: 2026.8.0, Home Assistant Container, amd64
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Feeder model
      description: Do not include the device UID or serial number.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all credentials, identifiers, private URLs and images.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed private data and did not perform an uncontrolled feeding test.
          required: true
